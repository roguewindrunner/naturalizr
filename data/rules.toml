# lang: "en", "ja", or "any"
# Japanese patterns: literal text and | only. No \b, no [ranges], no dot.

[[rule]]
id = "en.vocab.delve"
lang = "en"
pattern = '\bdelve into\b'
replace = "dig into"

[[rule]]
id = "en.vocab.utilize"
lang = "en"
pattern = '\butiliz(e|es|ed|ing)\b'
replace = "us$1"

[[rule]]
id = "en.connective.in-order-to"
lang = "en"
pattern = '\bin order to\b'
replace = "to"

[[rule]]
id = "ja.padding.suru-koto-ga-dekiru"
lang = "ja"
pattern = 'することができます'
replace = "できます"

[[rule]]
id = "ja.padding.to-iemasu"
lang = "ja"
pattern = 'と言えるでしょう'
replace = "でしょう"

[[rule]]
id = "ja.filler.ikagadeshita"
lang = "ja"
pattern = 'いかがでしたでしょうか。?'
replace = ""

[[rule]]
id = "en.vocab.leverage"
lang = "en"
pattern = '\bleverag(e|es|ed|ing)\b'
replace = "us$1"